<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>United Porte Academy</title>
<meta name="description" content="Training course for new United Porte team members.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%23f98d37'/%3E%3Cpath d='M12 32V10h16v22' fill='none' stroke='%23131313' stroke-width='4'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700;800&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: brand header bar, left course rail (drawer on phones), one reading column with prev/next at the foot. */
:root {
  --ground: #f6f6f6;
  --surface: #ffffff;
  --ink: #131313;
  --muted: #575757;
  --line: #e2e2e0;
  --orange: #f98d37;
  --orange-ink: #b9580c;
  --orange-wash: #fff1e5;
  --good: #2f7d4f;
  --good-wash: #e7f4ec;
  --bad: #b3361b;
  --bad-wash: #fbe9e4;
  --blue-ink: #24579a;
  --blue-wash: #e8f0fb;
  --font-display: "Urbanist", "Segoe UI", system-ui, sans-serif;
  --font-body: "Onest", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --rail: 288px;
  --bar: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #141312; --surface: #1d1c1a; --ink: #f2f0ec; --muted: #a8a49d; --line: #33312d;
    --orange: #f98d37; --orange-ink: #ffb276; --orange-wash: #3a2716;
    --good: #6cc492; --good-wash: #18301f; --bad: #f08a70; --bad-wash: #3a1d16; --blue-ink: #8fb8ec; --blue-wash: #172536;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #141312; --surface: #1d1c1a; --ink: #f2f0ec; --muted: #a8a49d; --line: #33312d;
  --orange: #f98d37; --orange-ink: #ffb276; --orange-wash: #3a2716;
  --good: #6cc492; --good-wash: #18301f; --bad: #f08a70; --bad-wash: #3a1d16; --blue-ink: #8fb8ec; --blue-wash: #172536;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--ground); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.6; }
a { color: var(--orange-ink); }
:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; border-radius: 4px; }

/* Top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: var(--bar); background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 16px; padding-inline: 16px; }
.bar .brand { display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--ink); min-width: 0; }
.logo-svg { height: 30px; width: auto; display: block; color: var(--ink); flex: none; }
.bar .tag { font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); border-left: 1px solid var(--line); padding-left: 14px; white-space: nowrap; }
.bar .spacer { flex: 1; }
.bar .progress-mini { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.menu-btn { display: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; height: 40px; padding: 0 12px; font: 600 14px var(--font-body); cursor: pointer; }

/* Shell */
.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: calc(100vh - var(--bar)); }
.rail { position: sticky; top: calc(var(--bar) + env(safe-area-inset-top, 0px)); align-self: start; height: calc(100vh - var(--bar)); overflow-y: auto; border-right: 1px solid var(--line); background: var(--surface); padding: 16px 12px 32px; }
.search { width: 100%; height: 40px; border: 1px solid var(--line); background: var(--ground); color: var(--ink); border-radius: 8px; padding: 0 12px; font: 14px var(--font-body); }
.rail h3 { font-family: var(--font-display); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 20px 8px 6px; }
.rail ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.navlink { display: grid; grid-template-columns: 28px minmax(0,1fr) auto; align-items: center; gap: 8px; padding: 8px; border-radius: 8px; text-decoration: none; color: var(--ink); font-size: 14px; line-height: 1.3; }
.navlink:hover { background: var(--ground); }
.navlink[aria-current="page"] { background: var(--orange-wash); color: var(--ink); font-weight: 600; }
.navlink .num { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 600 12px var(--font-mono); border: 1.5px solid var(--line); color: var(--muted); }
.navlink[aria-current="page"] .num { border-color: var(--orange); color: var(--orange-ink); }
.navlink.done .num { background: var(--good); border-color: var(--good); color: var(--surface); }
.navlink .pill { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 1px 7px; white-space: nowrap; }
.navlink .pill.ready { color: var(--orange-ink); border-color: var(--orange); }
.rail .home-link { margin-top: 12px; }
.rail .home-link .num { border: none; font-size: 15px; }

/* Main column */
main { min-width: 0; padding-block: 40px 80px; padding-inline: 24px; }
.page { max-width: 760px; margin: 0 auto; }
.eyebrow { font-family: var(--font-display); font-weight: 700; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--orange-ink); margin: 0 0 8px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: clamp(32px, 5vw, 46px); line-height: 1.08; letter-spacing: -.02em; margin: 0 0 16px; text-wrap: balance; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 26px; line-height: 1.2; letter-spacing: -.01em; margin: 48px 0 12px; text-wrap: balance; }
h3 { font-family: var(--font-display); font-weight: 700; font-size: 19px; margin: 24px 0 8px; }
p { margin: 0 0 14px; max-width: 66ch; }
.lead { font-size: 18px; color: var(--muted); }
ul.plain { margin: 0 0 14px; padding-left: 20px; }
ul.plain li { margin-bottom: 6px; }
code, .mono { font-family: var(--font-mono); font-size: .88em; background: var(--ground); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }

.meta { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: 14px; color: var(--muted); margin-bottom: 28px; }
.meta b { color: var(--ink); font-weight: 600; }

/* Objectives box */
.goals { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; margin: 24px 0; }
.goals h3 { margin-top: 0; font-size: 15px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.goals ul { margin: 0; padding-left: 20px; }
.goals li { margin-bottom: 6px; }

/* Rule callout */
.rule { border-left: 4px solid var(--orange); background: var(--orange-wash); border-radius: 0 10px 10px 0; padding: 14px 18px; margin: 18px 0; }
.rule strong { display: block; font-family: var(--font-display); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--orange-ink); margin-bottom: 4px; }
.rule p { margin: 0; }

/* Figures */
.figure { margin: 16px 0 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; }
.figure figcaption, .plans figcaption { font-size: 13.5px; color: var(--muted); margin-top: 8px; }
.anat { width: 100%; height: auto; display: block; }
.anat .floor { stroke: var(--muted); stroke-width: 2; }
.anat .casing { fill: var(--surface); stroke: var(--ink); stroke-width: 1.5; }
.anat .jamb { fill: var(--ground); stroke: var(--ink); stroke-width: 1.25; }
.anat .slab { fill: var(--orange-wash); stroke: var(--orange-ink); stroke-width: 1.5; }
.anat .hw { fill: var(--ink); }
.anat .lever { stroke: var(--ink); stroke-width: 5; stroke-linecap: round; }
.anat .lead line { stroke: var(--muted); stroke-width: 1.25; }
.anat .lead circle { fill: var(--muted); }
.anat .lbl { font: 600 16px var(--font-body); fill: var(--ink); }
.anat .lbl.sm { font-weight: 400; fill: var(--muted); font-size: 14px; }
.plans { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 16px 0 8px; }
.plans figure { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
.plans svg { width: 100%; height: auto; display: block; max-width: 180px; margin: 0 auto; }
.plans figcaption b { display: block; color: var(--ink); font-family: var(--font-display); font-size: 15px; }
.plans .wall { fill: var(--muted); }
.plans .leaf { stroke: var(--orange); stroke-width: 5; stroke-linecap: round; }
.plans .arc { fill: none; stroke: var(--muted); stroke-width: 1.25; stroke-dasharray: 4 4; }
.plans .pin { fill: var(--ink); }
.plans .side { font: 700 11px var(--font-display); letter-spacing: .1em; fill: var(--muted); text-anchor: middle; }
@media (max-width: 680px) { .plans { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* Code box */
.code { border: 1px solid var(--blue-ink); border-radius: 12px; padding: 14px 18px; margin: 18px 0; background: var(--surface); }
.code strong { display: block; font-family: var(--font-display); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--blue-ink); margin-bottom: 4px; }
.code p { margin: 0; }
.code a { color: var(--blue-ink); }

/* Fun-fact boxes */
.fact { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: start; border-radius: 12px; padding: 16px 18px; margin: 28px 0; }
.fact .dots3 { display: grid; grid-template-columns: repeat(3, 6px); gap: 3px; margin-top: 4px; }
.fact .dots3 i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .85; }
.fact .dots3 i:nth-child(5) { opacity: 0; }
.fact b { display: block; font-family: var(--font-display); font-size: 12.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 2px; }
.fact p { margin: 0; font-size: 15.5px; color: var(--ink); }
.fact-orange { background: var(--orange-wash); color: var(--orange-ink); }
.fact-blue { background: var(--blue-wash); color: var(--blue-ink); }
.fact-green { background: var(--good-wash); color: var(--good); }
.fact-dark { background: var(--ink); color: var(--orange); }
.fact-dark p { color: var(--surface); }

/* Tables */
.tablewrap { overflow-x: auto; margin: 12px 0 20px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 14.5px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-family: var(--font-display); font-weight: 700; font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); background: var(--ground); }
tr:last-child td { border-bottom: none; }
td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
.tag-s { display: inline-block; font-size: 12px; font-weight: 600; border-radius: 99px; padding: 1px 8px; white-space: nowrap; }
.tag-core { background: var(--orange-wash); color: var(--orange-ink); }
.tag-side { background: var(--ground); color: var(--muted); border: 1px solid var(--line); }

/* Contact strip */
.contact { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin: 16px 0 8px; }
.contact div { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
.contact span { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.contact b { font-weight: 600; overflow-wrap: anywhere; }
.copy { margin-left: 6px; font: 600 12px var(--font-body); color: var(--orange-ink); background: none; border: none; cursor: pointer; padding: 0; }

/* Showroom lists */
.rooms { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.rooms > div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; min-width: 0; }
.rooms h3 { margin-top: 0; font-size: 16px; }
.rooms ul { margin: 0; padding: 0; list-style: none; font-size: 14.5px; }
.rooms li { padding: 5px 0; border-bottom: 1px dashed var(--line); display: flex; justify-content: space-between; gap: 10px; }
.rooms li:last-child { border-bottom: none; }
.rooms li span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Hands-on checklist */
.tasks { list-style: none; padding: 0; margin: 12px 0; display: grid; gap: 8px; }
.tasks label { display: flex; gap: 12px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; }
.tasks input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--orange); flex: none; }

/* Quiz */
.quiz { display: grid; gap: 16px; margin-top: 12px; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; }
.q p.ask { font-weight: 600; margin-bottom: 10px; }
.q .opts { display: grid; gap: 8px; }
.q .opt { text-align: left; font: 15px var(--font-body); color: var(--ink); background: var(--ground); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
.q .opt:hover:not([disabled]) { border-color: var(--orange); }
.q .opt[disabled] { cursor: default; }
.q .opt.right { background: var(--good-wash); border-color: var(--good); }
.q .opt.wrong { background: var(--bad-wash); border-color: var(--bad); }
.q .why { margin: 10px 0 0; font-size: 14.5px; color: var(--muted); }
.score { font-weight: 600; font-variant-numeric: tabular-nums; }

/* Complete + pager */
.complete { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-top: 40px; padding: 18px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.btn { font: 600 15px var(--font-body); border-radius: 8px; padding: 11px 18px; cursor: pointer; border: 1px solid transparent; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
.btn-primary { background: var(--orange); color: #1b1006; }
.btn-primary:hover { filter: brightness(1.05); }
.btn-ghost { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn-done { background: var(--good-wash); color: var(--good); border-color: var(--good); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 24px; }
.pager a { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; text-decoration: none; color: var(--ink); min-width: 0; }
.pager a:hover { border-color: var(--orange); }
.pager small { display: block; color: var(--muted); font-size: 12.5px; text-transform: uppercase; letter-spacing: .08em; }
.pager b { font-family: var(--font-display); font-size: 17px; }
.pager .next { text-align: right; grid-column: 2; }

/* Home */
.hero { position: relative; padding: 8px 0 8px; }
.dots { display: grid; grid-template-columns: repeat(5, 10px); gap: 6px; margin-bottom: 22px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--orange); }
.dots i.k { background: var(--ink); }
.phases { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 16px 0; }
.phase { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; min-width: 0; }
.phase .when { font-size: 12.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.phase h3 { margin: 2px 0 10px; font-size: 18px; }
.phase ol { margin: 0 0 12px; padding: 0; list-style: none; font-size: 14px; display: grid; gap: 4px; }
.phase ol a { color: var(--ink); text-decoration: none; }
.phase ol a:hover { color: var(--orange-ink); text-decoration: underline; }
.phase .gate { margin-top: auto; border-top: 1px solid var(--line); padding-top: 10px; font-size: 13px; }
.phase .gate b { color: var(--orange-ink); display: block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.steps { counter-reset: s; list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
.steps li { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; font-size: 14.5px; }
.steps li::before { counter-increment: s; content: counter(s); display: grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--surface); font: 600 13px var(--font-mono); margin-bottom: 8px; }
.bigprog { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 8px 0 4px; }
.bigprog i { display: block; height: 100%; background: var(--orange); border-radius: 99px; }

/* Placeholder */
.soon { background: var(--surface); border: 1px dashed var(--muted); border-radius: 12px; padding: 22px; }
.soon p:last-child { margin-bottom: 0; }

.scrim { display: none; }

@media (max-width: 980px) {
  .phases { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .menu-btn { display: inline-flex; align-items: center; }
  .rail { position: fixed; top: calc(var(--bar) + env(safe-area-inset-top, 0px)); left: 0; bottom: 0; height: auto; width: min(320px, 88vw); z-index: 30; transform: translateX(-100%); transition: transform .2s ease; box-shadow: 0 10px 40px rgba(0,0,0,.18); }
  body.nav-open .rail { transform: none; }
  body.nav-open .scrim { display: block; position: fixed; inset: var(--bar) 0 0 0; background: rgba(0,0,0,.35); z-index: 25; }
  .bar .tag { display: none; }
  main { padding-inline: 16px; padding-block: 28px 64px; }
}
@media (max-width: 520px) {
  .phases { grid-template-columns: minmax(0, 1fr); }
  .pager { grid-template-columns: minmax(0, 1fr); }
  .pager .next { grid-column: 1; }
  .progress-mini { display: none; }
  .logo-svg { height: 26px; }
}
@media (prefers-reduced-motion: reduce) { .rail { transition: none; } }

/* ---- site additions ---- */
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
:root { --danger: #b3361b; }
.toplinks { margin-top: 12px; }
.toplinks .home-link { margin-top: 0; }
.rooms li span:last-child { white-space: normal !important; text-align: right; }
.muted-s { color: var(--muted); font-size: 14px; }
.muted-c { color: var(--muted); }
.who { font-size: 15px; color: var(--muted); margin-top: 8px; }
.nomatch { margin: 16px 8px; color: var(--muted); font-size: 14px; }
.navlink .pill.good { color: var(--good); border-color: var(--good); }
.navlink .pill.bad { color: var(--bad); border-color: var(--bad); }
.navlink.testlink .num { border-style: dashed; }
.phase .gate-line { margin-top: auto; border-top: 1px solid var(--line); padding-top: 10px; font-size: 14px; display: flex; gap: 8px; align-items: baseline; }
.phase .gate-line b { color: var(--orange-ink); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
.phase .gate-line a { color: var(--ink); font-weight: 600; }

/* profile form */
.profile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; margin: 18px 0; }
.profile p { margin-top: 0; }
.profile .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 14px; }
.profile label { display: grid; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; }
.profile input, .profile select { font: 15px var(--font-body); color: var(--ink); background: var(--ground); border: 1px solid var(--line); border-radius: 8px; height: 42px; padding: 0 10px; width: 100%; }
.gate .profile { border-color: var(--orange); }
.signin .row { display: flex; flex-wrap: wrap; gap: 10px; }
.formerr { color: var(--bad); font-weight: 600; margin: 0 0 12px; }
.signin input[name=code] { letter-spacing: .3em; font-family: var(--font-mono); font-size: 20px; max-width: 220px; }

/* result card */
.result { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; border-radius: 12px; padding: 16px 18px; margin: 12px 0 18px; border: 1.5px solid var(--line); background: var(--surface); }
.result.pass { border-color: var(--good); background: var(--good-wash); }
.result.fail { border-color: var(--bad); background: var(--bad-wash); }
.result .big { font: 800 34px var(--font-display); font-variant-numeric: tabular-nums; }
.result.pass .big { color: var(--good); }
.result.fail .big { color: var(--bad); }
.result p { margin: 2px 0 0; font-size: 14px; }
.result .sent { color: var(--muted); }
@media (max-width: 560px) { .result { grid-template-columns: auto minmax(0, 1fr); } .result .btn { grid-column: 1 / -1; justify-content: center; } }

/* tests */
.tq { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px 18px 10px; margin: 0 0 12px; }
.tq.answered { border-color: var(--orange); }
.tq legend { font-weight: 600; padding: 0 6px; margin-left: -6px; }
.tq label { display: flex; gap: 10px; align-items: flex-start; padding: 7px 4px; cursor: pointer; border-radius: 6px; }
.tq label:hover { background: var(--ground); }
.tq input { accent-color: var(--orange); margin-top: 4px; flex: none; }
.submitbar { position: sticky; bottom: env(safe-area-inset-bottom, 0px); display: flex; justify-content: space-between; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; margin-top: 16px; box-shadow: 0 -4px 20px rgba(0,0,0,.06); }
.submitbar span { font-variant-numeric: tabular-nums; color: var(--muted); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn-danger { background: var(--bad); color: #fff; }
.lockbox { background: var(--surface); border: 1px dashed var(--muted); border-radius: 12px; padding: 18px 20px; }
.lockbox ul { margin: 8px 0 0; padding-left: 20px; }
.rv { border-left: 4px solid var(--line); background: var(--surface); border-radius: 0 10px 10px 0; padding: 10px 14px; margin-bottom: 10px; }
.rv.ok { border-left-color: var(--good); }
.rv.no { border-left-color: var(--bad); }
.rv p { margin: 0 0 4px; }
.rv .why { color: var(--muted); font-size: 14px; }

/* grades */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin: 18px 0; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.tile span { display: block; font-size: 12.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.tile b { font: 800 22px var(--font-display); font-variant-numeric: tabular-nums; }
.gtable td a { color: var(--ink); }
.gtable tr.trow td { background: var(--orange-wash); font-weight: 600; }
.gpill { display: inline-block; min-width: 28px; text-align: center; font-weight: 700; border-radius: 99px; padding: 1px 8px; }
.gpill.good { background: var(--good-wash); color: var(--good); }
.gpill.bad { background: var(--bad-wash); color: var(--bad); }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 50; max-width: calc(100% - 32px); box-shadow: 0 8px 30px rgba(0,0,0,.2); }
</style>

  PAGES.m4 = function () {
    return `<p class="eyebrow">Part A · Module 4</p><h1>Measuring and feasibility</h1>
      <div class="meta"><span><b>Time</b> about 40 min</span><span><b>Ends with</b> 7-question quiz</span></div>
      <p class="lead">How to measure an opening, when a wall needs an extension, how far a door can be cut down, and the checks to run before you take an order.</p>
      <div class="goals"><h3>By the end you can</h3><ul>
        <li>Measure an opening and a wall the way we do.</li>
        <li>Decide when an extension is needed and quote it correctly.</li>
        <li>Know how much a door can be trimmed, and when it cannot.</li>
        <li>Explain the difference between a custom size and a custom order.</li>
        <li>Run the feasibility checklist before every order.</li></ul></div>

      <h2>How to measure</h2>
      <ol class="steps">
        <li><b>Width.</b> Measure the opening at the top, middle and bottom. Use the greatest value.</li>
        <li><b>Height.</b> Measure on the hinge side and on the handle side.</li>
        <li><b>Wall thickness.</b> Measure from one wall face to the other, through the opening.</li>
        <li><b>Check.</b> Compare with the rough opening formula from Module 2 and the Recommended opening on the product page.</li>
      </ol>
      <p>If the customer is not sure, sell the professional in-home measurement ($75). It costs far less than a door in the wrong size.</p>
      <ul class="plain">
        <li>A rough opening can be up to 1/4 in. off without any problem.</li>
        <li>The gap between the frame and the opening is filled with mounting foam and covered by the trims. Expect about 1 1/2 to 2 in. of allowance in total.</li>
        <li>The frame itself is about 1/2 in. smaller than the recommended opening.</li>
      </ul>

      <h2>Wall thickness and extensions</h2>
      <p>Our interior frame is 4 9/16 in. deep. The trims cover a little more, so most walls need nothing extra.</p>
      <div class="tablewrap"><table><thead><tr><th>Wall thickness</th><th>What you need</th></tr></thead><tbody>
        <tr><td class="num">Thinner than 4 9/16 in.</td><td>A standard frame is deeper than the wall. Offer a hidden door, which fits narrow walls, and check with ops before you sell a standard frame.</td></tr>
        <tr><td class="num">4 9/16 to 5 1/4 in.</td><td>Standard frame and trims. No extension.</td></tr>
        <tr><td class="num">5 1/2 in. and over</td><td>Extension needed.</td></tr>
      </tbody></table></div>
      <div class="rule"><strong>Extensions are two lines</strong><p>An extension needs the material (+$140 on the product page) and the installation labor (+$20 on the installation price list). Put both on the order.</p></div>
      ${fact("orange", "An extension board is only about 1/2 in. (10 mm) thick. It closes the gap across the whole wall so the frame looks built in.")}

      <h2>Cutting a door to size</h2>
      <p>The Custom Size service cuts one of our stock doors down to the customer's size. It takes 1 to 3 days.</p>
      <ul class="plain">
        <li>Price: $75 for a standard or pocket door, $150 for a hidden door.</li>
        <li>Maximum size: under 42 x 96 in.</li>
        <li>Write the exact finished <b>slab</b> size in the order comments, for every door. Never write the opening size.</li>
        <li>If the door size changes, the frame and trims must change too.</li>
      </ul>
      <h3>How far a door can be cut</h3>
      <div class="tablewrap"><table><thead><tr><th>Cut</th><th>Limit</th></tr></thead><tbody>
        <tr><td>Height</td><td>At least 2 in. on all interior doors. From 80 in., cutting to 76 or 75 in. is fine; 74 in. can ruin the door.</td></tr>
        <tr><td>Width, with a lock</td><td>About 3/4 in. at most. Cut more and the lock no longer fits.</td></tr>
        <tr><td>Width, flush doors without a lock</td><td>Flush models such as 0010, 0020, 0770, 0990 and EGO 5000 can go down to about 9 3/4 in.</td></tr>
        <tr><td>Glass doors</td><td>Only the glass area changes; the frame rails stay the same. A cut close to the glass can damage the door.</td></tr>
        <tr><td>Models that cannot be cut</td><td>0040 cannot be cut in height. 8831 cannot go down to 73 in. Panel doors such as 4111 cannot be cut much.</td></tr>
      </tbody></table></div>
      <div class="rule"><strong>Before you cut</strong><p>A cut door can never be returned. Cutting also changes how the grain looks, so on a job where doors are seen side by side, cut all of them or none. On gloss doors the cut edge comes out matte.</p></div>
      ${fact("blue", "Honeycomb-core doors are the easiest to cut, because the core is a light honeycomb with solid wood only around the edges.")}

      <h2>Custom size or custom order?</h2>
      <div class="tablewrap"><table><thead><tr><th></th><th>Custom size</th><th>Custom order</th></tr></thead><tbody>
        <tr><td>What it is</td><td>A stock door cut down at our facility</td><td>A door made at the factory to the customer's size or design</td></tr>
        <tr><td>Lead time</td><td>1 to 3 days</td><td>3 to 4 months</td></tr>
        <tr><td>Price</td><td>$75 or $150 on top of the door</td><td>Factory quote; the extra cost varies by model</td></tr>
        <tr><td>Returnable</td><td>No</td><td>No</td></tr>
      </tbody></table></div>
      <p>The website can show "1 to 10 business days" on a size that is really a custom order. For any size that is not standard, confirm with ops before you promise a date.</p>

      <h2>Checklist before every order</h2>
      ${tasks("m4c", [
        "Swing direction confirmed in writing, and the active leaf on double doors (patio doors are judged from inside).",
        "Wall thickness measured. Extension added if the wall is 5 1/2 in. or more.",
        "Rough opening matches the formula and the product page.",
        "Pocket door: the wall cavity is available and you know if it is 2x4 or 2x6.",
        "Barn door: there is clear wall beside the opening for the door to slide, and the floor is level for magic hardware.",
        "Bypass: the ceiling has a solid header for the rail.",
        "Exterior door: there is a canopy or overhang above it.",
        "Metal-plastic door: the customer knows the clear opening is about 32 in.",
        "Custom size: exact slab size written for every door."
      ])}
      ${fact("green", "The factory only needs the finished slab size. Writing the opening size instead is a known way to get a door cut wrong.")}

      <h2>Hands-on tasks</h2>
      ${tasks("m4", [
        "Measure a showroom opening at the top, middle and bottom, and on both sides for height.",
        "Measure the wall thickness at that opening and decide if it needs an extension.",
        "Go on one in-home measurement with an installer.",
        "Work out the rough opening for a 32 x 84 in. hidden door and check it on the product page.",
        "Write a practice custom size comment for two doors with your trainer."
      ])}

      <h2>Quiz</h2><p>Pick an answer to see why it is right or wrong.</p>
      ${quiz([
        { q: "At what wall thickness do you need an extension?", o: ["4 in.", "5 in.", "5 1/2 in.", "7 in."], a: 2, why: "Up to about 5 1/4 in. the frame and trims cover the wall. At 5 1/2 in. an extension is needed." },
        { q: "An extension goes on the order as…", o: ["One line for the material", "One line for labor", "Two lines: material (+$140) and labor (+$20)", "Nothing; it is free"], a: 2, why: "The material is on the product page and the labor is on the installation price list." },
        { q: "The wall is only 3 1/2 in. thick. What do you offer?", o: ["A standard frame", "A hidden door", "A thicker door", "An extension"], a: 1, why: "A standard frame will not fit. Hidden doors fit narrow walls." },
        { q: "What size do you write for a custom size cut?", o: ["The opening size", "The exact finished slab size", "The frame size", "The listed size"], a: 1, why: "The factory needs the exact slab size for every door." },
        { q: "A customer wants an 80 in. door cut to 74 in. What do you say?", o: ["No problem", "That cut can ruin the door; 75 in. is the safe limit", "Only on glass doors", "Order a custom door"], a: 1, why: "Cutting to 76 or 75 in. is fine; 74 in. can ruin the door." },
        { q: "How long does a custom order take?", o: ["1 to 3 days", "1 to 10 business days", "3 to 4 months", "1 year"], a: 2, why: "Custom orders are made at the factory: quote 3 to 4 months." },
        { q: "What must every exterior door have above it to keep the warranty?", o: ["A light", "A canopy or overhang", "A transom", "A storm door"], a: 1, why: "Without overhead protection, exterior door damage is not covered." }
      ])}
      ${completeBox("m4")}${pager("m4")}`;
  };

  PAGES.m5 = function () {

  PAGES.m6 = function () {
    return `<p class="eyebrow">Part B · Module 6</p><h1>Lead times and expectations</h1>
      <div class="meta"><span><b>Time</b> about 25 min</span><span><b>Ends with</b> 6-question quiz</span></div>
      <p class="lead">How long things really take, what slows them down, and how to give customers dates you can keep.</p>

        <li>Spot the orders that need a check before you promise a date.</li>
        <li>Tell a customer about a delay clearly and honestly.</li></ul></div>

      <h2>Lead times to quote</h2>

      </tbody></table></div>
      <div class="rule"><strong>Custom orders</strong><p>Always quote 3 to 4 months, even when the website shows a shorter range. On sizes that are not standard, the website can show "1 to 10 business days" for something that is really a custom order. Check with ops first.</p></div>

      <h2>What slows orders down</h2>
      <ul class="plain">
        <li><b>The production queue.</b> Dates from ops are expectations, not promises. When the queue is long, sellers get a notice.</li>

        <li><b>Containers.</b> Arrival dates for containers from Europe often slip by weeks.</li>
        <li><b>Regional routes.</b> Truck routes close, usually in the morning. Orders that miss the route slip 3 to 5 days.</li>

      <div class="code"><strong>Sample message</strong><p>Hi [Name], I want to update you on your order [number]. It is now expected to [ship / arrive] between [date] and [date], later than we first planned because [short reason]. I will message you as soon as it leaves our warehouse. I am sorry for the wait, and I am here if you have any questions.</p></div>

  PAGES.m9 = function () {
    return `<p class="eyebrow">Part C · Module 9</p><h1>Order entry in 1C</h1>
      <div class="meta"><span><b>Time</b> about 50 min</span><span><b>Ends with</b> 7-question quiz</span></div>

        <li>Add shipping and the dealer discount correctly.</li>
        <li>Reserve, save and print the invoice.</li>
        <li>Avoid the entry mistakes that send the wrong door.</li></ul></div>

      <h2>Before you open 1C</h2>
      <p>From the order email or your notes, collect:</p>
      <ul class="plain">
        <li>Customer full name, <b>phone number</b>, delivery address and state.</li>
        <li>Dealer name and order number, if it is a dealer order.</li>
        <li>Product SKU, width, and any custom height or width.</li>
        <li>Add-ons such as soft close, handles and locks.</li>
        <li>The retail price on unitedporte.us for the set and add-ons, so you can check the invoice total at the end.</li>
      </ul>

      <h2>Step by step</h2>
      <ol class="steps">
        <li><b>Create.</b> Go to Sales → SALES → Create.</li>
        <li><b>Header.</b> Customer (search, or create new); incoming number (dealer prefix + order number, for example MCD1549); sales schema; shipping address; ship-by date.</li>
        <li><b>Product.</b> Select goods → search the SKU → double-click. The SET row appears with its sub-items. Check the panel count matches the number of slabs.</li>
        <li><b>Add-ons.</b> Use "Add into set" on the SET row. On every double bypass, soft close quantity is 2, one per side.</li>
        <li><b>Cuts.</b> Click the gear on the SET row and fill the cut type and "Cut to" sizes for each panel.</li>
        <li><b>Shipping.</b> "Add free item/serv." → SHIPPING, quantity 1, price by state and door type. No discount on this line.</li>
        <li><b>Dealer discount.</b> Prices and discounts → Apply max discounts. Cut lines need the discount entered by hand.</li>
        <li><b>Check.</b> The set total must equal the website retail total.</li>
        <li><b>Reserve.</b> Reserve → 15 days.</li>
        <li><b>Save and print.</b> Print → Invoice(old). Answer Yes to save, OK to the tax recalculation, OK to post. Save the PDF named with the invoice number.</li>
      </ol>

      <h2>Sales schema</h2>
      <div class="tablewrap"><table><thead><tr><th>Use</th><th>For</th></tr></thead><tbody>
        <tr><td>Our delivery</td><td>A customer, or a dealer's showroom</td></tr>
        <tr><td>Movement</td><td>Only for United Porte's own showrooms</td></tr>
        <tr><td>Exhibition</td><td>Never for a customer order</td></tr>
      </tbody></table></div>

      <h2>Cuts</h2>
      <div class="tablewrap"><table><thead><tr><th>Door</th><th>Height cut</th><th>Width cut</th></tr></thead><tbody>
        <tr><td>Standard solid door</td><td><code>B1</code> bottom only</td><td><code>B5</code> one side</td></tr>
        <tr><td>Glass or mirror in the middle (for example the 1299 series)</td><td><code>B2</code> top and bottom</td><td><code>B6</code> both sides</td></tr>
      </tbody></table></div>
      <ul class="plain">
        <li>The custom size fee goes into the cut line prices, never as a separate item. Example: $75 per slab, split across the height and width cut lines.</li>
        <li>Enter the <b>exact finished slab size</b> for every panel. Never the opening size.</li>
        <li>Cutting instructions go in the <b>works comments</b>. "Comments for print" are not seen by production.</li>
        <li>Write a comment for <b>each</b> door. A single checkbox cuts only one door.</li>
        <li>Changing a line's quantity does <b>not</b> copy the works to the new doors. Re-check them.</li>
        <li>If a door's size changes, change the frame and trim sizes too.</li>
        <li>Bypass doors: write "cut round pull on ONE side only" in the warehouse notes, or the pull is cut on both faces.</li>
      </ul>
      ${fact("orange", "Three slips have shipped wrong doors before: the opening size written instead of the slab size, a cut typed in the print comments, and a quantity changed without re-checking the works.")}

      <h2>Handles and locks on the invoice</h2>
      <ul class="plain">
        <li><code>CYL</code> and <code>WC</code> items are only the cover and cylinder. Add the magnetic lock and striker as separate lines.</li>
        <li>If you add a handle without a lock function, the door arrives as passage and will not lock.</li>
        <li>Work codes: <code>C2</code> = Europe handle with magnetic lock, passage. <code>C3</code> = Europe handle with magnetic lock, privacy or entry.</li>
        <li>The cylinder cut must be on <b>every</b> door that needs it, not just the first.</li>
        <li>Double doors: works row 1 is the left leaf, row 2 the right. Add 2 flush bolts.</li>

      <h2>Mistakes to avoid</h2>
      <div class="tablewrap"><table><thead><tr><th>Problem</th><th>How to avoid it</th></tr></thead><tbody>

        <tr><td>No delivery text messages</td><td>Never finish an invoice without a phone number. Email notices go only if the email field is filled.</td></tr>
        <tr><td>Can't change a posted invoice</td><td>Once posted or sent for packing it is locked. Ask ops for changes; a new fulfilment needs a new invoice.</td></tr>
        <tr><td>Order cancelled by itself</td><td>Reserves last 15 days at most and can lapse. When one expires, 1C cancels the invoice. Watch your reserves.</td></tr>
        <tr><td>Custom item not in 1C</td><td>Enter a similar stock door, describe the real item in the comments, and set the correct price.</td></tr>
        <tr><td>"Division by zero" error</td><td>Click OK; it is harmless.</td></tr>
      </tbody></table></div>
      <div class="rule"><strong>Write everything in 1C</strong><p>Every special request, cut, color and promise goes into the 1C comment. Ops handles hundreds of orders and cannot remember what was agreed in a chat.</p></div>

      <h2>Hands-on tasks</h2>
      ${tasks("m9", [
        "Watch your trainer enter a complete dealer order in 1C from start to finish.",
        "Enter a practice invoice for a double bypass door with soft close and a custom height.",
        "Print Invoice(old) and check every line against the website retail total.",
        "Find your open reserves and check their expiry dates."
      ])}

      <h2>Quiz</h2>
      ${quiz([
        { q: "Which sales schema do you use for a customer delivery?", o: ["Exhibition", "Movement", "Our delivery", "Any"], a: 2, why: "Our delivery is for customers and dealers' showrooms. Movement is only for our own showrooms. Never Exhibition." },

        { q: "Should shipping get the dealer discount?", o: ["Yes", "No", "Only in zone A", "Only on doubles"], a: 1, why: "Shipping is never discounted." },
        { q: "How long can a reserve last?", o: ["Forever", "15 days at most", "30 days", "90 days"], a: 1, why: "Reserves last 15 days at most, and 1C cancels the invoice when they expire." }
      ])}
      ${completeBox("m9")}${pager("m9")}`;

  PAGES.m10 = function () {
    return `<p class="eyebrow">Part C · Module 10</p><h1>Payment, credit and fraud</h1>
      <div class="meta"><span><b>Time</b> about 25 min</span><span><b>Ends with</b> 6-question quiz</span></div>

      <h2>Storage and unpaid orders</h2>
      <ul class="plain">

    if (!ready()) return head + profileGate() + pager(id);
    var miss = CONFIG.lockTests ? missing(t) : [];
    if (miss.length) {
      return head + '<div class="lockbox"><b>This test opens when you finish:</b><ul>' + miss.map(function (m) { return '<li><a href="#' + m + '">' + esc(label(ITEMS[m])) + "</a></li>"; }).join("") + "</ul></div>" + pager(id);
    }
    var r = store.results[id];
    if (r && !renderTest.retake) {
      return head + resultCard(id) + review(id) + pager(id);
    }
    renderTest.retake = false;
    var body = qs.map(function (q, qi) {
      return '<fieldset class="tq"><legend>' + (qi + 1) + ". " + esc(q.q) + "</legend>" +
        order(q.o.length).map(function (oi) { return '<label><input type="radio" name="tq-' + qi + '" id="tq-' + qi + "-" + oi + '" value="' + oi + '"><span>' + esc(q.o[oi]) + "</span></label>"; }).join("") + "</fieldset>";
    }).join("");
    return head + "<p>Answer every question, then submit. You will see your score and the correct answers after you submit.</p>" +
      '<form id="testForm" data-id="' + id + '">' + body +
      '<div class="submitbar"><span id="answered">0 of ' + qs.length + ' answered</span><button class="btn btn-primary" id="submitTest" type="submit" disabled>Submit test</button></div></form>' + pager(id);
  }
  function review(id) {
    var r = store.results[id], qs = ITEMS[id].qs;
    if (!r.answers) return "";
    return "<h2>Review your answers</h2>" + qs.map(function (q, i) {
      var a = r.answers[i], ok = a === q.a;
      return '<div class="rv ' + (ok ? "ok" : "no") + '"><p class="ask">' + (i + 1) + ". " + esc(q.q) + "</p>" +
        "<p>" + (ok ? "✓ " : "✗ Your answer: " + esc(q.o[a]) + " · Correct: ") + "<b>" + esc(q.o[q.a]) + "</b></p><p class=\"why\">" + esc(q.why) + "</p></div>";
    }).join("");
  }
  PAGES.mid = function () { return renderTest("mid"); };
  PAGES["final"] = function () { return renderTest("final"); };

  /* ---------- Router ---------- */
  function route() {
    var id = (location.hash || "#home").slice(1);
    if (!PAGES[id]) id = "home";
    CUR = id;
    document.getElementById("page").innerHTML = PAGES[id]();
    renderNav(id);
    document.body.classList.remove("nav-open");
    document.getElementById("menuBtn").setAttribute("aria-expanded", "false");
    window.scrollTo(0, 0);
    document.title = (ITEMS[id] ? label(ITEMS[id]) + " · " : id === "grades" ? "My grades · " : "") + "United Porte Academy";
  }

  /* ---------- Events ---------- */
  document.addEventListener("click", function (e) {
    var opt = e.target.closest(".opt");
    if (opt) {
      var q = opt.closest(".q"); if (q.dataset.done) return;
      var ans = +q.dataset.answer, pick = +opt.dataset.i;
      q.dataset.done = pick === ans ? "right" : "wrong";
      q.querySelectorAll(".opt").forEach(function (b) { var i = +b.dataset.i; b.disabled = true; if (i === ans) b.classList.add("right"); else if (i === pick) b.classList.add("wrong"); });
      q.querySelector(".why").hidden = false;
      var wrap = q.closest(".quizwrap"), all = wrap.querySelectorAll(".q"), answered = wrap.querySelectorAll(".q[data-done]");
      if (answered.length === all.length) {
        var right = wrap.querySelectorAll('.q[data-done="right"]').length;
        var missed = Array.prototype.map.call(wrap.querySelectorAll('.q[data-done="wrong"] .ask'), function (p) { return p.textContent; });
        var id = wrap.dataset.id;
        record(id, right, all.length, missed);
        var slot = wrap.querySelector(".rslot, .result");
        var div = document.createElement("div"); div.innerHTML = resultCard(id);
        slot.replaceWith(div.firstChild);
        wrap.querySelector(".result").scrollIntoView({ behavior: "smooth", block: "center" });
        toast("Quiz graded: " + store.results[id].pct + "% (" + store.results[id].grade + ")");
      }
      return;
    }
    var rt = e.target.closest(".retake");
    if (rt) {
      var w = rt.closest(".quizwrap"), qz = w.querySelector(".quiz");
      qz.innerHTML = quizQuestions(QUIZZES[w.dataset.id]); qz.hidden = false;
      var res = w.querySelector(".result"), sl = document.createElement("div"); sl.className = "rslot"; res.replaceWith(sl);
      qz.scrollIntoView({ behavior: "smooth", block: "start" });
      return;
    }
    if (e.target.closest(".tretake")) { renderTest.retake = true; route(); return; }
    if (e.target.closest("#resendCode")) {
      api("requestCode", { email: SIGN.email }).then(function (j) { if (j.ok) toast("New code sent to " + SIGN.email); else showErr(j.error); });
      return;
    }
    if (e.target.closest("#changeEmail")) { SIGN.step = "email"; route(); return; }
    if (e.target.closest("#signOut")) {
      syncNow().then(function () {
        store = { tasks: {}, profile: null, results: {}, outbox: [], auth: null };
        try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (err) {}
        location.hash = "#home"; route(); toast("Signed out.");
      });
      return;
    }
    if (e.target.closest("#flush")) { flushOutbox().then(function (n) { toast(n ? n + " result(s) sent." : "Could not send yet. Check your connection."); route(); }); return; }
    if (e.target.closest("#resetBtn")) { document.getElementById("resetYes").hidden = false; return; }
    if (e.target.closest("#resetYes")) { store = { tasks: {}, profile: null, results: {}, outbox: [] }; save(); location.hash = "#home"; route(); toast("Progress erased."); return; }
    var cp = e.target.closest(".copy");
    if (cp) {
      var txt = cp.dataset.copy;
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function () { cp.textContent = "Copied"; setTimeout(function () { cp.textContent = "Copy"; }, 1500); }, function () { cp.textContent = "Select and copy"; });
      return;
    }
  });
  document.addEventListener("submit", function (e) {
    if (e.target.id === "profileForm") {
      e.preventDefault();
      var f = e.target, el = f.elements, name = el["name"].value.trim();
      if (!name) { el["name"].focus(); return; }
      store.profile = { name: name, email: ONLINE ? store.auth.email : el["email"].value.trim(), showroom: el["showroom"].value };
      save(); flushOutbox(); toast("Saved. Welcome, " + name.split(" ")[0] + "!");
      var y = window.scrollY; route(); window.scrollTo(0, CUR === "home" ? 0 : y);
      return;
    }
    if (e.target.id === "signInForm" || e.target.id === "codeForm") {
      e.preventDefault();
      var form = e.target, btn = form.querySelector("button[type=submit]"); btn.disabled = true;
      if (form.id === "signInForm") {
        SIGN.email = form.elements["email"].value.trim().toLowerCase();
        api("requestCode", { email: SIGN.email }).then(function (j) {
          btn.disabled = false;
          if (j.ok || j.error === "wait") { SIGN.step = "code"; route(); toast(j.ok ? "Code sent to " + SIGN.email : ERRORS.wait); }
          else showErr(j.error);
        });
      } else {
        api("verifyCode", { email: SIGN.email, code: form.elements["code"].value }).then(function (j) {
          btn.disabled = false;
          if (!j.ok) { showErr(j.error); return; }
          store.auth = { email: j.email, token: j.token };
          merge(j.data);
          if (store.profile) store.profile.email = j.email;
          SIGN = { step: "email", email: "" };
          save(); flushOutbox(); route();
          toast(store.profile && store.profile.name ? "Welcome back, " + store.profile.name.split(" ")[0] + "!" : "Signed in. Add your name to finish.");
        });
      }
      return;
    }
    if (e.target.id === "testForm") {
      e.preventDefault();
      var id = e.target.dataset.id, qs = ITEMS[id].qs, answers = [], score = 0, missed = [];
      for (var i = 0; i < qs.length; i++) {
        var c = e.target.querySelector('input[name="tq-' + i + '"]:checked');
        if (!c) { toast("Answer every question first."); return; }
        var a = +c.value; answers.push(a);
        if (a === qs[i].a) score++; else missed.push((i + 1) + ". " + qs[i].q);
      }
      record(id, score, qs.length, missed, answers);
      route();
      toast(ITEMS[id].t + " graded: " + store.results[id].pct + "% (" + store.results[id].grade + ")");
    }
  });
  document.addEventListener("change", function (e) {
    if (e.target.matches(".tasks input")) { var k = e.target.dataset.key; if (e.target.checked) store.tasks[k] = 1; else delete store.tasks[k]; save(); }
    if (e.target.matches("#testForm input[type=radio]")) {
      var f = e.target.form, total = ITEMS[f.dataset.id].qs.length, n = f.querySelectorAll("input[type=radio]:checked").length;
      document.getElementById("answered").textContent = n + " of " + total + " answered";
      document.getElementById("submitTest").disabled = n < total;
      e.target.closest("fieldset").classList.add("answered");
    }
  });
  document.getElementById("search").addEventListener("input", function () { renderNav(CUR); });
  document.getElementById("menuBtn").addEventListener("click", function () { var open = document.body.classList.toggle("nav-open"); this.setAttribute("aria-expanded", String(open)); });
  document.getElementById("scrim").addEventListener("click", function () { document.body.classList.remove("nav-open"); document.getElementById("menuBtn").setAttribute("aria-expanded", "false"); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") document.body.classList.remove("nav-open"); });
  window.addEventListener("hashchange", route);
  route();
  if (ONLINE && store.auth) {
    api("load", { token: store.auth.token }).then(function (j) {
      if (j.ok) { merge(j.data); save(); route(); flushOutbox(); }
      else if (j.error === "signed_out") signedOut();
    });
  } else flushOutbox();
})();

</script>
</body>
</html>
